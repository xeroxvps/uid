# Render Blueprint for free XRIXUID demo hosting (Postgres expires after 30 days).
services:
  - type: web
    name: xrixuid-cloud
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: xrixuid-cloud-db
          property: connectionString

databases:
  - name: xrixuid-cloud-db
    plan: free
    region: singapore
    databaseName: xrixuid
    user: xrixuid
