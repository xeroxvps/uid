name: Unpack Xerox UID ZIP

on:
  push:
    branches: [main]
    paths:
      - "xrixuid.zip"
      - "scripts/extract_zip.py"
      - ".github/workflows/unpack-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xrixuid-unpack
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate archive and extract source files
        run: python3 scripts/extract_zip.py xrixuid.zip unpacked
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A unpacked/
          if ! git diff --cached --quiet; then
            git commit -m "Sync unpacked Xerox UID source from xrixuid.zip"
            git push origin HEAD:main
          else
            echo "Extracted tree already up to date."
          fi
